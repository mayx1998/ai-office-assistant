llm:
  provider: dashscope
  model: qwen-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY        # key 只从环境变量读，永不写进这个文件

mcp_servers:
  - name: office
    command: officecli
    args: ["mcp"]
  - name: contact
    command: python
    args: ["mcp_servers.py"]            # ← 按你通讯录 server 的真实文件名改

limits:
  max_steps: 10
  max_retries: 3
  mcp_timeout_s: 30
  cli_timeout_s: 30
  per_tool_max_calls: 15
  concurrency: 4          # 无状态工具的并发上限
  office_concurrency: 1   # Office 工具必须串行（真实 Office 是单实例）

paths:
  allowed_dirs:           # 路径白名单：相对条目按【项目根目录】解析，clone 到任何位置都能跑
    - .                    # 项目根目录：裸文件名（如 report.docx）落在这里
    - eval/sandbox         # 评测系统的隔离工作区
    - outputs              # 批量服务的产物目录

trace:
  db: traces.db
llm:
  provider: dashscope
  model: qwen-plus
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY        # key 只从环境变量读，永不写进文件

mcp_servers:
  - name: office
    command: officecli
    args: ["mcp"]
  - name: contact
    command: python
    args: ["src/mcp_servers/contact_server.py"]

limits:
  max_steps: 10
  max_retries: 3
  mcp_timeout_s: 30
  cli_timeout_s: 30
  per_tool_max_calls: 15
  concurrency: 4          # 无状态工具的并发上限
  office_concurrency: 1   # Office 类工具必须串行（真实 Office 是单实例的）

paths:
  allowed_dirs:           # 第 4 步路径白名单用
    - D:\dev\基于MCP的AI办公助手\eval\sandbox
    - D:\dev\基于MCP的AI办公助手\outputs

trace:
  db: traces.db